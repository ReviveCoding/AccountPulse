[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "accountpulse"
version = "1.0.0"
description = "Evidence-controlled predictive decision science for capacity-constrained account prioritization"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary-Research"
authors = [{ name = "AccountPulse" }]
dependencies = [
  "catboost==1.2.10",
  "duckdb==1.5.5",
  "filelock==4.0.1",
  "joblib==1.6.0",
  "matplotlib==3.11.2",
  "numpy==2.5.3",
  "openpyxl>=3.1,<4",
  "pandas==3.0.6",
  "plotly==7.1.0",
  "polars==1.44.2",
  "psutil==7.2.2",
  "pyarrow==25.0.1",
  "pyyaml==6.0.3",
  "requests==2.34.2",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "torch==2.14.0+cu132",
  "tqdm==4.70.1",
  "ucimlrepo==0.0.7",
  "xgboost==3.4.1",
]

[project.optional-dependencies]
acquisition = ["kaggle==2.2.4", "kagglehub==1.0.2"]
mlops = ["mlflow>=3.0,<4"]
survival = ["lifelines>=0.30,<0.31"]
deep = ["sentence-transformers>=5,<6", "torch-geometric>=2.7,<3"]

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "coverage[toml]>=7.10,<8",
  "mypy>=1.18,<2",
  "pandas-stubs>=2.3",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.13,<1",
  "types-PyYAML>=6.0",
  "types-requests>=2.32",
]

[project.scripts]
accountpulse = "accountpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
python-preference = "only-managed"
python-downloads = "never"
torch-backend = "cu132"

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["accountpulse"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "src/accountpulse/cli.py",
  "src/accountpulse/causal.py",
  "src/accountpulse/contracts.py",
  "src/accountpulse/evidence.py",
  "src/accountpulse/paths.py",
  "src/accountpulse/pipeline.py",
  "src/accountpulse/protection.py",
  "src/accountpulse/provenance.py",
  "src/accountpulse/reporting.py",
  "src/accountpulse/scoring.py",
]
warn_unused_configs = true
follow_imports = "skip"
ignore_missing_imports = true
